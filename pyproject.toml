[project]
name = "bosch-thermostat-client"
dynamic = ["version"]
description = "Python API for talking to Bosch™ Heating gateway using HTTP or XMPP"
authors = [
    {name = "Pawel Szafer", email = "pszafer@gmail.com"},
]
dependencies = [
    "aiohttp>=3.9.0",
    "click>=8.1.7",
    "colorlog>=6.8.2",
    "pyaes>=1.6.1",
    "pytz>=2024.1",
    "pyyaml>=6.0.1",
    "slixmpp>=1.8.5",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "Apache License 2.0"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool]
[tool.pdm]
version = { source = "file", path = "bosch_thermostat_client/version.py" }
[tool.pdm.dev-dependencies]
dev = [
    "ruff>=0.8.0",
    "bandit>=1.7.5",
    "pre-commit>=3.2.1",
]

[project.scripts]
bosch_cli= "bosch_thermostat_client.bosch_cli:cli"

[tool.ruff]
line-length = 88
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "pdm/_vendor",
    "tests/fixtures",
]

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), and isort (I)
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["bosch_thermostat_client"]

[tool.ruff.format]
# Use Black-compatible formatting
quote-style = "double"
indent-style = "space"

[tool.pdm.scripts]
lint = "pre-commit run --all-files"
format = "ruff format ."
check = "ruff check ."
fix = "ruff check --fix ."
